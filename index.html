<style>
:root{color-scheme:light dark;--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#66655f;--ac:#2f7d5b;--onac:#fff;--bd:#e4e2da;--bad:#b42318;--p:#3b82f6;--c:#d97706;--f:#a855f7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151513;--card:#201f1d;--tx:#efeee9;--mu:#a9a79f;--ac:#4cb58a;--onac:#0b1f17;--bd:#3a3834;--bad:#f87171}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#151513;--card:#201f1d;--tx:#efeee9;--mu:#a9a79f;--ac:#4cb58a;--onac:#0b1f17;--bd:#3a3834;--bad:#f87171}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto;position:relative}
#hdr{padding:calc(.5rem + env(safe-area-inset-top,0px)) 1rem .5rem}
.dnav{display:flex;align-items:center;gap:.5rem}
.ibtn{min-width:2.75rem;min-height:2.75rem;border-radius:.75rem;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:1.375rem;line-height:1;padding:0}
.ibtn:disabled{opacity:.35;cursor:default}
.dl{flex:1;min-height:2.75rem;border-radius:.75rem;border:1px solid var(--bd);background:var(--card);font-weight:600;padding:0 .75rem;cursor:pointer;text-align:center}
#vt h1{margin:0;font-size:1.375rem;line-height:2.75rem}
#main{flex:1;overflow-y:auto;padding:.25rem 1rem 1.25rem;overscroll-behavior:contain;position:relative}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:1rem;margin-bottom:.75rem}
h2{font-size:1rem;margin:1.25rem 0 .5rem;font-weight:700}
h3{font-size:.875rem;color:var(--mu);margin:1rem 0 .25rem;font-weight:600}
.mu{color:var(--mu);font-size:.875rem}
.lbl{font-size:.875rem;color:var(--mu)}
.bad{color:var(--bad)}
.link{background:none;border:0;color:var(--ac);font-weight:600;min-height:2.75rem;padding:0;cursor:pointer;text-align:left}
/* resumen del día */
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:.75rem}
.hero .k{font-size:2.5rem;font-weight:700;line-height:1.05}
.hero .k small{font-size:1rem;font-weight:600;color:var(--mu)}
.hero .side{text-align:right}.hero .side .s{font-size:1rem}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-top:.875rem}
.mac .n{font-size:.8125rem;color:var(--mu);display:flex;align-items:center}
.mac b{font-size:1rem;display:block}
.mac .sub{font-size:.8125rem;color:var(--mu)}
.bar{height:.5rem;border-radius:.5rem;background:var(--bd);overflow:hidden;margin:.375rem 0 .125rem}
.bar i{display:block;height:100%;background:var(--ac);border-radius:.5rem}
.bar.over i{background-color:var(--bad);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.4) 0 4px,transparent 4px 8px)}
.d{display:inline-block;width:.625rem;height:.625rem;border-radius:50%;margin-right:.3rem;flex:none}
.d.p{background:var(--p)}.d.c{background:var(--c)}.d.f{background:var(--f)}
.mcs{display:inline-flex;flex-wrap:wrap;gap:0 .75rem}
.mc{display:inline-flex;align-items:center;white-space:nowrap}
/* barra mínima fija al bajar */
#mini{position:sticky;top:-.25rem;z-index:4;height:0;margin:0 -1rem}
#mini .mb{position:absolute;left:0;right:0;top:0;background:var(--bg);border-bottom:1px solid var(--bd);padding:.5rem 1rem .375rem;transform:translateY(-110%);opacity:0;transition:transform .2s,opacity .2s;pointer-events:none}
#mini.on .mb{transform:none;opacity:1;pointer-events:auto}
#mini .mt{display:flex;justify-content:space-between;gap:.5rem;font-size:.9375rem}
/* registro */
.item{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid var(--bd);min-height:3.5rem;cursor:pointer}
.item:last-child{border:0}
.item .il{flex:1;min-width:0}
.item .nm{font-weight:600;overflow-wrap:anywhere}
.item .sub{font-size:.875rem;color:var(--mu);display:flex;flex-wrap:wrap;gap:0 .75rem;align-items:center}
.item .x{min-width:2.75rem;min-height:2.75rem;border:0;background:none;color:var(--mu);font-size:1.25rem;cursor:pointer;border-radius:.75rem}
.badge{display:inline-block;margin-left:.5rem;font-size:.75rem;font-weight:600;color:var(--mu);border:1px solid var(--bd);border-radius:999px;padding:0 .5rem;vertical-align:middle}
.pill{flex:none;min-height:2.25rem;padding:0 .75rem;border-radius:999px;border:1px solid var(--bd);background:var(--bg);font-size:.8125rem;font-weight:600;cursor:pointer}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.125rem 0 .5rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:2.5rem;padding:0 .875rem;border-radius:999px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:.875rem;white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed=true]{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.note{background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.75rem 1rem;margin-bottom:.75rem;font-size:.9375rem}
.note .acts{margin-top:.5rem}
.empty{text-align:center;padding:1.25rem 1rem}
.empty p{margin:0 0 .75rem;color:var(--mu)}
/* formularios y botones */
.btn{min-height:2.75rem;padding:0 1rem;border-radius:.75rem;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600;cursor:pointer}
.btn.pri{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.btn.del{color:var(--bad)}
.btn.sm{min-height:2.25rem;padding:0 .75rem;font-size:.875rem}
.btn:disabled{opacity:.5}
.field{display:flex;flex-direction:column;gap:.25rem;font-size:.8125rem;color:var(--mu)}
.field input,.field select,input.in,select.in,textarea.in{min-height:2.75rem;border:1px solid var(--bd);border-radius:.75rem;background:var(--bg);color:var(--tx);padding:.5rem .75rem;font-size:1rem;width:100%;min-width:0}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:.5rem 0}
.frm .w{grid-column:1/-1}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}
.acts .btn{flex:1;min-width:6rem}
.row2{display:flex;gap:.5rem;align-items:center;margin:.5rem 0}
.row2 input{flex:1}
.seg{display:flex;border:1px solid var(--bd);border-radius:.75rem;overflow:hidden;background:var(--card)}
.seg button{flex:1;min-height:2.75rem;border:0;background:none;font-weight:600;cursor:pointer;padding:0 .5rem}
.seg button+button{border-left:1px solid var(--bd)}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--onac)}
details.card>summary{cursor:pointer;font-weight:600;min-height:2.75rem;display:flex;align-items:center}
.opt{background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.75rem 1rem;margin:.5rem 0}
.opt .ot{font-weight:700;margin-bottom:.25rem}
.srow{padding:.25rem 0}.srow .sn{overflow-wrap:anywhere}
.srow .sub{font-size:.875rem;color:var(--mu);display:flex;flex-wrap:wrap;gap:0 .75rem}
.opt .btn{margin-top:.5rem;width:100%}
.opt.warn{border-color:var(--bad)}
.mr{margin:.5rem 0}.mr .top{display:flex;justify-content:space-between;gap:.5rem;font-size:.9375rem}
.hr{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.75rem 1rem;margin:.5rem 0;cursor:pointer}
.hr .top{display:flex;justify-content:space-between;gap:.5rem}
.chartbox{margin:.5rem 0}.chart{width:100%;height:auto;display:block}.chart text{fill:var(--mu);font-size:10px}
.ctip{min-height:1.5rem}
/* pie de pantalla */
#foot{border-top:1px solid var(--bd);background:var(--bg)}
.reply{margin:.5rem 1rem 0;background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.5rem .5rem .5rem 1rem;display:flex;flex-wrap:wrap;gap:.25rem .5rem;max-height:30vh;overflow:auto;align-items:flex-start}
.reply .rt{flex:1;white-space:pre-line;font-size:.9375rem;padding-top:.5rem}
.reply .rx{min-width:2.75rem;min-height:2.75rem;border:0;background:none;font-size:1.125rem;color:var(--mu);cursor:pointer}
.reply .btn{margin:0 .5rem .5rem 0}
#fm{display:flex;gap:.5rem;padding:.5rem 1rem;align-items:flex-end}
#txt{flex:1;min-height:3rem;max-height:8rem;resize:none;border:1px solid var(--bd);border-radius:1.5rem;background:var(--card);padding:.75rem 1rem;line-height:1.3;overflow-y:auto;font-size:1rem;min-width:0}
.rb{width:3rem;height:3rem;flex:none;border-radius:50%;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0}
.rb svg,#tabs svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rb svg{width:1.5rem;height:1.5rem}
.rb.pri{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.rb.rec{background:var(--bad);color:var(--bg);border-color:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.65}}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--bd);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{min-height:3.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.125rem;background:none;border:0;color:var(--mu);font-size:.75rem;font-weight:600;cursor:pointer;padding:.25rem 0}
#tabs button[aria-current=page]{color:var(--ac)}
#tabs svg{width:1.5rem;height:1.5rem}
#toast{position:absolute;left:1rem;right:1rem;bottom:calc(var(--foot,7rem) + .5rem);z-index:10;background:var(--tx);color:var(--bg);border-radius:.75rem;padding:.25rem .25rem .25rem 1rem;display:flex;align-items:center;gap:.5rem;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast .tt{flex:1;white-space:pre-line;font-size:.9375rem;padding:.375rem 0}
#toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;min-height:2.75rem;padding:0 .75rem;cursor:pointer}
/* hoja inferior */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.panel{position:relative;width:100%;max-width:600px;max-height:90%;overflow-y:auto;background:var(--card);border-radius:1.25rem 1.25rem 0 0;padding:.5rem 1rem calc(1rem + env(safe-area-inset-bottom,0px));outline:0;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.grab{width:2.5rem;height:.25rem;border-radius:.25rem;background:var(--bd);margin:.25rem auto .5rem}
.sh{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}
.sh h2{margin:0;font-size:1.125rem}
.sh button{min-width:2.75rem;min-height:2.75rem;border:0;background:none;font-size:1.25rem;color:var(--mu);cursor:pointer}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.opt .sub{font-size:.875rem;color:var(--mu);display:flex;flex-wrap:wrap;gap:0 .75rem}

function calcGoals(p){
 const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='f'?-161:5),act={1:1.2,2:1.375,3:1.55,4:1.725}[p.act]||1.375;
 let k=bmr*act;if(p.goal==='lose')k*=.85;else if(p.goal==='gain')k*=1.1;
 const floor=p.sex==='f'?1200:1500;let capped=false;if(k<floor){k=floor;capped=true}
 k=Math.round(k/10)*10;const pr=Math.round(p.w*(p.goal==='lose'?2:1.8)),f=Math.round(k*.27/9),c=Math.max(0,Math.round((k-pr*4-f*9)/4));
 return{k,p:pr,c,f,capped,floor}}

// dictado por voz (Web Speech API del navegador): convierte palabras a números y separa alimentos
const NW={};'dos 2,tres 3,cuatro 4,cinco 5,seis 6,siete 7,ocho 8,nueve 9,diez 10,once 11,doce 12,trece 13,catorce 14,quince 15,dieciseis 16,diecisiete 17,dieciocho 18,diecinueve 19,veinte 20,veintiuno 21,veintidos 22,veintitres 23,veinticuatro 24,veinticinco 25,veintiseis 26,veintisiete 27,veintiocho 28,veintinueve 29,treinta 30,cuarenta 40,cincuenta 50,sesenta 60,setenta 70,ochenta 80,noventa 90,cien 100,ciento 100,doscientos 200,trescientos 300,cuatrocientos 400,quinientos 500,seiscientos 600,setecientos 700,ochocientos 800,novecientos 900'.split(',').forEach(p=>{const q=p.split(' ');NW[q[0]]=+q[1]});
function numWords(t){const w=t.split(/\s+/),o=[],nk=x=>norm(x).replace(/[.,;]$/,'');
 for(let i=0;i<w.length;i++){const k=nk(w[i]);if(NW[k]==null){o.push(w[i]);continue}
  let sum=NW[k],prev=NW[k],j=i+1;
  while(j<w.length){let m=j;if(norm(w[m])==='y'&&m+1<w.length)m++;const v=NW[nk(w[m])];if(v==null)break;
   if((prev>=100&&v<prev)||(prev>=30&&prev<100&&prev%10===0&&v<10)){sum+=v;prev=v;j=m+1}else break}
  o.push(String(sum));i=j-1}
 return o.join(' ')}
const splitVoice=t=>t.replace(/([a-záéíóúñ])\s+(?=\d)/gi,'$1, ');
function collapseRep(v){
 const nz=t=>t.toLowerCase().replace(/[.,;¿?¡!]/g,''),w=v.split(/\s+/).filter(x=>nz(x)),n=w.map(nz);
 if(n.length<2)return v;
 let last=-1;n.forEach((x,i)=>{if(x===n[0])last=i});
 if(last<=0)return v;
 const T=n.slice(last),H=n.slice(0,last),memo={};
 const can=p=>{if(p===H.length)return true;if(p in memo)return memo[p];let ok=false;
  for(let L=1;L<=T.length&&p+L<=H.length&&!ok;L++){let m=true;for(let k=0;k<L;k++)if(H[p+k]!==T[k]){m=false;break}if(m&&can(p+L))ok=true}
  return memo[p]=ok};
 return can(0)?w.slice(last).join(' '):v}
