<html lang="es"><head><meta charset="utf-8">

<title>Macros del día</title>

<meta name="theme-color" content="#2f7d5b">
<link rel="icon" href="icon-192.png">

<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--ac:#2f7d5b;--bd:#e4e2da;--bad:#c2410c;--p:#3b82f6;--c:#d97706;--f:#a855f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151513;--card:#201f1d;--tx:#efeee9;--mu:#a19f97;--ac:#4cb58a;--bd:#33312e;--bad:#fb923c}}
:root[data-theme="dark"]{--bg:#151513;--card:#201f1d;--tx:#efeee9;--mu:#a19f97;--ac:#4cb58a;--bd:#33312e;--bad:#fb923c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{padding:12px 14px 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.top{display:flex;justify-content:space-between;align-items:baseline}
.big{font-size:28px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.mac b{font-size:15px}
#main{flex:1;overflow:auto;padding:4px 14px 10px}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.item button{background:none;border:0;color:var(--mu);font-size:20px;padding:0 6px}
.msg{margin:8px 0;padding:8px 12px;border-radius:14px;max-width:88%;white-space:pre-wrap}
.u{background:var(--ac);color:#fff;margin-left:auto}.b{background:var(--card);border:1px solid var(--bd)}
form{display:flex;gap:8px;padding:8px 14px 12px;border-top:1px solid var(--bd);background:var(--bg)}
input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:0}
#txt{flex:1}
form button{font:inherit;border:0;border-radius:12px;background:var(--ac);color:#fff;padding:0 16px}
details{margin-top:8px}summary{color:var(--mu);font-size:14px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.g label{font-size:12px;color:var(--mu)}.g input{width:100%;padding:8px}
h3{font-size:14px;color:var(--mu);margin:12px 0 2px;font-weight:600}
.nav{display:flex;gap:6px;margin-bottom:8px}.nav button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 12px}.nav .dl{flex:1}.nav button:disabled{opacity:.35}
[hidden]{display:none!important}
.ed{padding:8px 0;border-bottom:1px solid var(--bd)}.ed .g5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:6px 0}.ed label{font-size:11px;display:block}.ed input{width:100%;padding:8px 6px}
.acts{display:flex;gap:6px}.acts button{font:inherit;flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px}.acts .pri{background:var(--ac);color:#fff;border:0}.acts .del{color:var(--bad)}
.item{cursor:pointer}.hr{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:6px 0}
.mr{margin:6px 0}.mr .top{font-size:14px}#ml{max-height:38vh;overflow:auto}#mic{margin-top:8px}
.row2{display:flex;gap:8px;align-items:center;margin:6px 0}.row2 input{flex:1}
#sug button{font:inherit;border:0;border-radius:12px;background:var(--ac);color:#fff;padding:10px 14px}
#sug select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px}
.opt{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}.opt div{white-space:pre-wrap}.opt .add{margin-top:8px;padding:8px 12px}
#bkp button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}
#bk{width:100%;margin-top:6px;font:12px monospace;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px}
#food button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}#food .pri{background:var(--ac);color:#fff;border-color:var(--ac)}#food input,#food select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;min-width:0;width:100%}#food .row2 input{flex:1}#food .frm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}#food .frm label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:2px}#food .frm .w{grid-column:1/-1}#food .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}#food .bad{color:var(--bad);font-size:13px;margin-top:6px}

<div id="app">
<header><div class="nav"><button id="pv" aria-label="Día anterior">‹</button><button id="dl" class="dl"></button><button id="nx" aria-label="Día siguiente">›</button><button id="hb">Historial</button><button id="sb">Sugerir</button><button id="fb">Alimentos</button></div><div class="card" id="sum">

  <div class="g">

<details id="bkp"><summary>Copia de seguridad</summary>

  <textarea id="bk" rows="5" hidden></textarea><div class="row2"><button type="button" id="bkgo" hidden>Cargar</button></div>
 </details></div></header>
<div id="main"><div id="dayv"><h3 id="lt">Registro</h3><div id="log"></div><h3>Chat</h3><div id="chat"></div></div><div id="hist" hidden></div><div id="sug" hidden>

</div>
